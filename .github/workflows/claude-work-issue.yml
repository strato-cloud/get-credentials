name: Claude Work Issue
on:
  issues:
    # Only issues labeled AI: labeled covers both an issue opened with the
    # label and one that gets it later (the shared workflow checks the label).
    types: [labeled]

# issues is a low-trust trigger: restore caches, never save them.
cache-mode: read

jobs:
  call:
    uses: strato-cloud/automation/.github/workflows/claude-work-issue.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    secrets: inherit
